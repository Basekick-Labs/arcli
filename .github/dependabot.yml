version: 2
updates:
  # Keeps the SHA-pinned actions in release.yml (and the major tags in
  # ci.yml) moving through reviewable PRs.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
