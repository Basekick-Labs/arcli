name: Dependency smoke (arcli 86 and 88)

# Branch-only evidence for arcli #86 (cosign-installer 4.1.3) and #88
# (docker/login-action 4.8.0). Both run only in release.yml, on a tag push,
# so CI never exercises them. Never tag, publish, sign, push an image, or
# read release secrets from this workflow. Same approach as ops#5.
on:
  push:
    branches: [fix/ops-dependabot-86-88]
    paths: [.github/workflows/dependency-smoke-86-88.yml]

permissions:
  contents: read
  packages: read

jobs:
  cosign:
    name: cosign-installer ${{ matrix.v }} (PR 86)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        v: [baseline-4.1.2, candidate-4.1.3]
    steps:
      - if: matrix.v == 'baseline-4.1.2'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.5.2'
      - if: matrix.v == 'candidate-4.1.3'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: 'v2.5.2'
      # Same cosign-release input as release.yml; the installer itself
      # verifies the downloaded binary. The pinned version must come out.
      - name: cosign is the pinned release
        run: |
          set -euo pipefail
          cosign version 2>&1 | tee version.txt
          grep -E 'GitVersion:\s+v2\.5\.2' version.txt
          cosign sign-blob --help >/dev/null

  login:
    name: login-action ${{ matrix.v }} (PR 88)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        v: [baseline-4.7.0, candidate-4.8.0]
    steps:
      # Same inputs as release.yml, but the token can only read packages.
      - if: matrix.v == 'baseline-4.7.0'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: matrix.v == 'candidate-4.8.0'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Logged in to GHCR, and an authenticated read works
        run: |
          set -euo pipefail
          jq -e '.auths["ghcr.io"]' ~/.docker/config.json >/dev/null
          docker manifest inspect ghcr.io/basekick-labs/arcli:latest >/dev/null
          echo "GHCR login and authenticated manifest read OK"
