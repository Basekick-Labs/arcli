name: Dependency smoke (ops 5)

# Branch-only evidence for ops #5. Never tag, publish, sign, log in to a
# registry, or access release secrets from this workflow.
on:
  push:
    branches: [fix/ops-5-dependabot-cleanup]
    paths: [.github/workflows/dependency-smoke.yml]

permissions:
  contents: read

jobs:
  syft:
    name: Syft archive SBOMs (PR 43)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          cache: true
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      # Recheck the merged release-action combination, including the
      # downloader's cosign verification, without signing or publishing.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.5.2'
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: '~> v2.18'
          args: release --snapshot --clean --skip=publish,sign,docker
      - name: Verify archive SBOMs
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, json
          files = glob.glob('dist/*.sbom.json')
          assert len(files) == 6, files
          for path in files:
              with open(path) as f:
                  sbom = json.load(f)
              assert sbom['spdxVersion'].startswith('SPDX-'), path
              assert sbom.get('packages'), path
          print('Verified six SPDX archive SBOMs')
          PY

  docker:
    name: Buildx with QEMU ${{ matrix.qemu }} (PRs 38 and 39)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        qemu: [baseline, candidate]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.25'
          cache: true
      - if: matrix.qemu == 'baseline'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - if: matrix.qemu == 'candidate'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and execute each release platform without pushing
        shell: bash
        run: |
          set -euo pipefail
          context="$RUNNER_TEMP/arcli-smoke"
          mkdir -p "$context/linux/amd64" "$context/linux/arm64"
          cp Dockerfile "$context/Dockerfile"
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -o "$context/linux/$arch/arcli" ./cmd/arcli
            docker buildx build --platform "linux/$arch" --load -t "arcli-smoke:$arch" "$context"
            docker run --rm --platform "linux/$arch" "arcli-smoke:$arch" --version
          done

  setup-go:
    name: Setup Go 7 (${{ matrix.os }}, PR 22)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          cache: true
      - name: Verify build, race tests, vet, and formatting
        shell: bash
        run: |
          set -euo pipefail
          go version
          go build ./...
          go test -race -count=1 ./...
          go vet ./...
          test -z "$(gofmt -l .)"

  goreleaser:
    name: GoReleaser action ${{ matrix.form }} (PR 20)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        form: [ci-tag, release-pin]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.25'
          cache: true
      - if: matrix.form == 'ci-tag'
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2.18'
          args: release --snapshot --clean --skip=publish,sign,sbom,docker
      - if: matrix.form == 'release-pin'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.5.2'
      - if: matrix.form == 'release-pin'
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: '~> v2.18'
          args: release --snapshot --clean --skip=publish,sign,sbom,docker
