name: Release

# Fires on every v* tag (CalVer like Arc: v26.09.1, v26.09.2, …; artifact
# versions are normalised to 26.9.1 by GoReleaser). GoReleaser builds
# the archives, deb/rpm/Arch packages, SBOMs, the multi-arch GHCR image
# and the Homebrew formula, and creates the GitHub release. GoReleaser
# publishes images → GitHub release → formula, so a formula failure
# would leave a complete release with no tap entry; the preflight below
# refuses to start when the tap token is missing or dead instead. A
# rerun of the same tag replaces the assets and re-pushes the images.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub release + upload assets
  packages: write # push the container image to GHCR
  id-token: write # cosign keyless signing (Sigstore OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Actions are SHA-pinned here (Dependabot moves them): this workflow
      # holds contents:write, packages:write, an OIDC identity that mints
      # signing certificates in the repo's name, and a PAT to the tap.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0 # full history for the changelog
          persist-credentials: false # hooks run repo code; the token is not needed after checkout

      - name: Refuse a tag that is not on main
        run: |
          git fetch --no-tags origin main
          commit=$(git rev-parse "HEAD^{commit}")
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME ($commit) is not reachable from main"
            exit 1
          fi

      - name: Refuse to run without a working Homebrew tap token
        # The formula push is GoReleaser's last publish step, so a missing,
        # expired or under-scoped token would otherwise surface after the
        # release and the images are already public. Probe the tap now.
        # curl never echoes the request header; GitHub masks the secret.
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN secret is not set (fine-grained PAT, contents:write on Basekick-Labs/homebrew-tap)"
            exit 1
          fi
          hdr=$(mktemp)
          if ! curl -fsS -o /dev/null -D "$hdr" -H "Authorization: Bearer $HOMEBREW_TAP_TOKEN" \
               https://api.github.com/repos/Basekick-Labs/homebrew-tap; then
            echo "::error::HOMEBREW_TAP_TOKEN cannot read Basekick-Labs/homebrew-tap (expired or wrong repository access?)"
            exit 1
          fi
          exp=$(grep -i '^github-authentication-token-expiration:' "$hdr" | cut -d' ' -f2- | tr -d '\r')
          [ -n "$exp" ] && echo "::notice::HOMEBREW_TAP_TOKEN expires $exp"

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.25'
          cache: true

      - name: Set up QEMU (multi-arch image build)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Syft (SBOMs)
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
        with:
          cosign-release: 'v2.5.2'

      - name: Test before releasing
        run: go test -race -count=1 ./...

      - name: Pick release notes header
        id: notes
        run: |
          f="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$f" ]; then
            echo "args=--release-header=$f" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::no $f; the release body is the generated changelog + footer only"
            echo "args=" >> "$GITHUB_OUTPUT"
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: "~> v2.18" # release.preflight needs 2.18; brews is kept until v3
          args: release --clean ${{ steps.notes.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Check the GHCR package is publicly pullable
        # A package is private the first time it is created; there is no
        # API to flip it, so warn loudly and point at the settings page.
        run: |
          v="${GITHUB_REF_NAME#v}"
          tok=$(curl -fsS "https://ghcr.io/token?scope=repository:basekick-labs/arcli:pull" | jq -r .token)
          if curl -fsS -o /dev/null -H "Authorization: Bearer $tok" \
               -H "Accept: application/vnd.oci.image.index.v1+json" \
               "https://ghcr.io/v2/basekick-labs/arcli/manifests/$v"; then
            echo "ghcr.io/basekick-labs/arcli:$v is public"
          else
            echo "::warning::ghcr.io/basekick-labs/arcli:$v is not anonymously pullable; make the package public at https://github.com/orgs/Basekick-Labs/packages/container/arcli/settings"
          fi
